<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CASHLICK - Register</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}

body{
min-height:100vh;
background:#050505;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.register-box{
width:100%;
max-width:400px;
background:#101010;
border:1px solid #292929;
border-radius:24px;
padding:25px 20px;
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
width:58px;
height:58px;
margin:0 auto 12px;
border-radius:17px;
background:linear-gradient(145deg,#ffe082,#d4a72c,#8f6b12);
color:#050505;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:19px;
}

.brand{
text-align:center;
font-size:24px;
font-weight:900;
letter-spacing:3px;
}

.subtitle{
text-align:center;
color:#777;
font-size:10px;
margin-top:5px;
}

.form{
margin-top:24px;
}

label{
display:block;
font-size:10px;
color:#aaa;
margin:0 0 7px 2px;
}

.input{
width:100%;
height:47px;
background:#070707;
border:1px solid #292929;
border-radius:11px;
color:#fff;
padding:0 12px;
font-size:12px;
outline:none;
margin-bottom:14px;
}

.input:focus{
border-color:#d4a72c;
}

.password-wrap{
position:relative;
}

.password-wrap .input{
padding-right:55px;
}

.show{
position:absolute;
right:7px;
top:0;
height:47px;
width:45px;
border:none;
background:none;
color:#777;
font-size:9px;
cursor:pointer;
}

.register-btn{
width:100%;
height:49px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#ffe082,#d4a72c,#a77b17);
color:#080808;
font-size:12px;
font-weight:900;
cursor:pointer;
margin-top:4px;
}

.login{
text-align:center;
margin-top:18px;
font-size:10px;
color:#666;
}

.login a{
color:#d4a72c;
text-decoration:none;
font-weight:bold;
}

.message{
display:none;
margin-top:12px;
padding:11px;
border-radius:10px;
text-align:center;
font-size:10px;
}

.message.show{
display:block;
}

.error{
color:#ff7777;
background:#180909;
border:1px solid #392222;
}

.success{
color:#62df91;
background:#09180f;
border:1px solid #1d4a2d;
}

.footer{
text-align:center;
color:#444;
font-size:9px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="register-box">

<div class="logo">CL</div>

<div class="brand">CASHLICK</div>

<div class="subtitle">
AFFILIATE MARKETING PLATFORM
</div>

<form
class="form"
id="registerForm"
>

<label>USERNAME</label>

<input
class="input"
id="username"
type="text"
placeholder="Choose username"
required
>

<label>FULL NAME</label>

<input
class="input"
id="fullname"
type="text"
placeholder="Enter full name"
required
>

<label>PHONE NUMBER</label>

<input
class="input"
id="phone"
type="tel"
placeholder="Enter phone number"
required
>

<label>PASSWORD</label>

<div class="password-wrap">

<input
class="input"
id="password"
type="password"
placeholder="Create password"
required
>

<button
type="button"
class="show"
onclick="togglePassword('password',this)"
>
SHOW
</button>

</div>

<label>CONFIRM PASSWORD</label>

<div class="password-wrap">

<input
class="input"
id="confirmPassword"
type="password"
placeholder="Confirm password"
required
>

<button
type="button"
class="show"
onclick="togglePassword('confirmPassword',this)"
>
SHOW
</button>

</div>

<button
class="register-btn"
type="submit"
>
CREATE ACCOUNT
</button>

<div
class="message"
id="message"
></div>

</form>

<div class="login">
Already have an account?
<a href="login.html">Log In</a>
</div>

<div class="footer">
© 2026 CASHLICK
</div>

</div>

<script>

/* =========================================
   GET REFERRER FROM LINK
========================================= */

const urlParams =
new URLSearchParams(
window.location.search
);

const referral =
urlParams.get("ref") || "";


/* =========================================
   ACCOUNTS
========================================= */

function getAccounts(){

try{

const saved =
localStorage.getItem(
"cashlickAccounts"
);

if(!saved){
return [];
}

const accounts =
JSON.parse(saved);

return Array.isArray(accounts)
?accounts
:[];

}catch(error){

return [];

}

}


function saveAccounts(accounts){

localStorage.setItem(
"cashlickAccounts",
JSON.stringify(accounts)
);

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message show " + type;

}


/* =========================================
   PASSWORD
========================================= */

function togglePassword(
id,
button
){

const input =
document.getElementById(id);

if(input.type === "password"){

input.type = "text";

button.textContent =
"HIDE";

}else{

input.type = "password";

button.textContent =
"SHOW";

}

}


/* =========================================
   ID
========================================= */

function createID(){

return "CL-" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

}


/* =========================================
   REGISTER
========================================= */

document
.getElementById("registerForm")
.addEventListener(
"submit",
function(event){

event.preventDefault();


const username =
document.getElementById(
"username"
).value.trim();


const fullname =
document.getElementById(
"fullname"
).value.trim();


const phone =
document.getElementById(
"phone"
).value.trim();


const password =
document.getElementById(
"password"
).value;


const confirmPassword =
document.getElementById(
"confirmPassword"
).value;


/* =========================================
   VALIDATION
========================================= */

if(username.length < 3){

showMessage(
"Username must be at least 3 characters.",
"error"
);

return;

}


if(fullname.length < 3){

showMessage(
"Please enter your full name.",
"error"
);

return;

}


if(phone.length < 7){

showMessage(
"Please enter a valid phone number.",
"error"
);

return;

}


if(password.length < 6){

showMessage(
"Password must be at least 6 characters.",
"error"
);

return;

}


if(password !== confirmPassword){

showMessage(
"Passwords do not match.",
"error"
);

return;

}


/* =========================================
   GET ACCOUNTS
========================================= */

const accounts =
getAccounts();


/* =========================================
   USERNAME CHECK
========================================= */

const usernameExists =
accounts.some(function(user){

return String(
user.username || ""
)
.toLowerCase() ===
username.toLowerCase();

});


if(usernameExists){

showMessage(
"Username already exists.",
"error"
);

return;

}


/* =========================================
   PHONE CHECK
========================================= */

const phoneExists =
accounts.some(function(user){

return String(
user.phone || ""
).trim() === phone;

});


if(phoneExists){

showMessage(
"Phone number already registered.",
"error"
);

return;

}


/* =========================================
   CREATE ACCOUNT
========================================= */

const user = {

id:createID(),

username:username,

fullname:fullname,

fullName:fullname,

phone:phone,

password:password,

status:"pending",

accountStatus:"pending",

activated:false,

isActivated:false,

active:false,

pending:true,

referredBy:referral,

balance:0,

withdraw:0,

earnings:0,

commission:0,

totalEarnings:0,

level1Earnings:0,

level2Earnings:0,

level3Earnings:0,

level4Earnings:0,

referralEarnings:0,

commissionHistory:[],

createdAt:
new Date().toISOString()

};


/* =========================================
   SAVE
========================================= */

accounts.push(user);

saveAccounts(accounts);


/* =========================================
   CURRENT USER
========================================= */

localStorage.setItem(
"cashlickUser",
JSON.stringify(user)
);

localStorage.setItem(
"cashlickLoggedIn",
"true"
);

localStorage.setItem(
"cashlickLoggedInUser",
username
);


/* =========================================
   SUCCESS
========================================= */

showMessage(
"Account created successfully.",
"success"
);


/* =========================================
   GO PENDING
========================================= */

setTimeout(function(){

window.location.href =
"pending-dashboard.html";

},800);

});

</script>

</body>
</html>
